<div class="backdrop" (click)="close()" (keydown.escape)="close()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contact-title" (click)="$event.stopPropagation()">
    <button type="button" class="x" aria-label="סגירה" (click)="close()">×</button>
    <h2 id="contact-title">צור קשר – {{ doctorName }}</h2>

    @if (!sent()) {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          שם מלא
          <input type="text" formControlName="fullName" autocomplete="name" [class.bad]="invalid('fullName')" />
          @if (invalid('fullName')) {
            <small>יש להזין שם מלא (2–100 תווים)</small>
          }
        </label>
        <label>
          טלפון
          <input type="tel" dir="ltr" formControlName="phone" autocomplete="tel" placeholder="050-1234567" [class.bad]="invalid('phone')" />
          @if (invalid('phone')) {
            <small>מספר טלפון אינו תקין</small>
          }
        </label>
        <label>
          אימייל
          <input type="email" dir="ltr" formControlName="email" autocomplete="email" [class.bad]="invalid('email')" />
          @if (invalid('email')) {
            <small>כתובת אימייל אינה תקינה</small>
          }
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <div class="row">
          <button type="button" class="btn ghost" (click)="close()">ביטול</button>
          <button type="submit" class="btn" [disabled]="submitting()">{{ submitting() ? 'שולח...' : 'שליחה' }}</button>
        </div>
      </form>
    } @else {
      <p class="ok" role="status">הפרטים נשלחו בהצלחה. נחזור אליכם בהקדם.</p>
      <div class="row"><button type="button" class="btn" (click)="close()">סגירה</button></div>
    }
  </div>
</div>
